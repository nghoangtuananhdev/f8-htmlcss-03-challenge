<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F8 Project 03 - Challenge</title>
    <link rel="stylesheet" href="./assets/css/reset.css" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100..900;1,100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <!-- Navbar -->
        <nav class="navbar">
          <!-- Logo -->
          <a href="#!" class="logo navbar__logo">
            <img src="./assets/img/logo.svg" alt="MODULARS" class="logo__img" />
          </a>

          <!-- Navigation Menu -->
          <ul class="navbar__list">
            <li class="navbar__item">
              <a href="#!" class="navbar__link">Home</a>
            </li>
            <li class="navbar__item">
              <a href="#!" class="navbar__link">About</a>
            </li>
            <li class="navbar__item">
              <a href="#!" class="navbar__link">Blog</a>
            </li>
            <li class="navbar__item">
              <a href="#!" class="navbar__link">Contact</a>
            </li>
          </ul>

          <!-- Action / CTA Button -->
          <div class="navbar__action">
            <a href="#!" class="btn navbar__btn">Sign Up</a>
          </div>
        </nav>

        <!-- Bottom Divider Line -->
        <div class="navbar__divider"></div>
      </div>
    </header>
    <!-- Main -->
    <main>
      <!-- Hero Section -->
      <section class="hero">
        <div class="container">
          <div class="hero__inner">
            <!-- Hero Content -->
            <div class="hero__content">
              <h1 class="hero__heading">We’re a creative design agency.</h1>
              <p class="hero__desc">
                A brilliant, modular agency template for startup’s build yours
                today.
              </p>
              <div class="hero__actions">
                <a href="#!" class="btn hero__btn">Get in touch</a>
                <img
                  src="./assets/img/hero-play-button-design.svg"
                  alt=""
                  class="hero__play-button-design"
                />
                <a href="#!" class="hero__watch-btn">
                  <img
                    src="./assets/img/hero-play-button.svg"
                    alt=""
                    class="hero__watch-icon"
                  />
                </a>
                <a href="#!" class="hero__watch-text">Watch Video</a>
              </div>
            </div>

            <!-- Hero Media (Khung chờ cho phần hình ảnh) -->
            <div class="hero__media">
              <!-- Sẽ bổ sung phần hình ảnh và trang trí ở bước sau -->
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
